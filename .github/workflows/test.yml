name: Test & Security Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Run tests (pytest)
        run: |
          python -m pytest tests/ -v --tb=short

      # Phase 1.5: Demo 模式端到端验证
      - name: Verify demo mode
        run: |
          python main.py --output output/test_result.json
          python -c "
          import json
          with open('output/test_result.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert 'safety_scan' in data, 'Missing safety_scan field'
          assert 'token_usage' in data.get('metadata', {}), 'Missing token_usage'
          print(f\"Demo OK: {data['safety_scan']['passed']} / {data['metadata']['token_usage']}\")
          "

      # Phase 1.3: 依赖安全审计
      - name: Dependency security audit
        run: |
          pip-audit
